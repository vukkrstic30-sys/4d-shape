<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4D Shape</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #17172d 0%,
                    #080810 55%,
                    #030306 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .page {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: clamp(15px, 4vh, 40px);
        }

        h1 {
            margin: 0;

            font-size:
                clamp(28px, 6vw, 60px);

            text-align: center;

            letter-spacing: 2px;

            text-shadow:
                0 0 10px #8d72ff,
                0 0 30px rgba(141, 114, 255, 0.5);
        }

        p {
            margin:
                clamp(5px, 1vh, 12px)
                0
                clamp(8px, 2vh, 20px);

            color: #bdbddd;

            font-size:
                clamp(14px, 2vw, 20px);

            text-align: center;
        }

        .canvas-wrapper {
            width: min(95vw, 900px);

            height: min(
                70vh,
                700px
            );

            display: flex;

            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;

            border-radius:
                clamp(10px, 2vw, 20px);

            background: #05050b;

            border: 1px solid #25253e;

            cursor: crosshair;

            box-shadow:
                0 0 40px
                rgba(120, 90, 255, 0.15);
        }

        .hint {
            margin-top:
                clamp(8px, 2vh, 18px);

            color: #777799;

            font-size:
                clamp(11px, 1.5vw, 15px);

            text-align: center;
        }

        @media (max-width: 600px) {

            .page {
                padding: 12px;
            }

            .canvas-wrapper {
                width: 96vw;
                height: 62vh;
            }

        }

        @media (max-height: 600px) {

            .page {
                padding: 8px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                margin-bottom: 5px;
            }

            .canvas-wrapper {
                height: 65vh;
            }

            .hint {
                margin-top: 5px;
            }

        }
    </style>
</head>

<body>

<div class="page">

    <h1>Wellcome! 👋</h1>

    <p>This is a 4D shape.</p>

    <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="hint">
        Move your mouse around the shape to rotate it 🌀
    </div>

</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


// ============================================================
// RESPONSIVE CANVAS
// ============================================================

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const pixelRatio =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * pixelRatio;

    canvas.height =
        rect.height * pixelRatio;

    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


// ============================================================
// MOUSE
// ============================================================

let mouseX = 0;
let mouseY = 0;

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        mouseX =
            (event.clientX - rect.left)
            / rect.width - 0.5;

        mouseY =
            (event.clientY - rect.top)
            / rect.height - 0.5;

    }
);


// ============================================================
// TESSERACT VERTICES
// ============================================================

const vertices = [];

for (let x of [-1, 1]) {

    for (let y of [-1, 1]) {

        for (let z of [-1, 1]) {

            for (let w of [-1, 1]) {

                vertices.push([
                    x,
                    y,
                    z,
                    w
                ]);

            }

        }

    }

}


// ============================================================
// TESSERACT EDGES
// ============================================================

const edges = [];

for (
    let i = 0;
    i < vertices.length;
    i++
) {

    for (
        let j = i + 1;
        j < vertices.length;
        j++
    ) {

        let differences = 0;

        for (
            let k = 0;
            k < 4;
            k++
        ) {

            if (
                vertices[i][k] !==
                vertices[j][k]
            ) {

                differences++;

            }

        }

        if (differences === 1) {

            edges.push([
                i,
                j
            ]);

        }

    }

}


// ============================================================
// 4D ROTATION
// ============================================================

function rotate4D(
    point,
    axisA,
    axisB,
    angle
) {

    const result =
        point.slice();

    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);

    result[axisA] =
        point[axisA] * cos -
        point[axisB] * sin;

    result[axisB] =
        point[axisA] * sin +
        point[axisB] * cos;

    return result;

}


// ============================================================
// 4D → 3D → 2D
// ============================================================

function project4D(point) {

    const distance4D = 4;

    const wScale =
        distance4D /
        (distance4D - point[3]);

    let x =
        point[0] * wScale;

    let y =
        point[1] * wScale;

    let z =
        point[2] * wScale;


    const distance3D = 5;

    const zScale =
        distance3D /
        (distance3D - z);

    x *= zScale;
    y *= zScale;


    return [
        x,
        y,
        z
    ];

}


// ============================================================
// ANIMATION
// ============================================================

let time = 0;


function draw() {

    time += 0.012;


    const rect =
        canvas.getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ========================================================
    // TRANSFORM
    // ========================================================

    const projected =
        vertices.map(function(vertex) {

            let point =
                vertex.slice();


            point =
                rotate4D(
                    point,
                    0,
                    3,
                    time * 0.9 +
                    mouseX * 1.5
                );


            point =
                rotate4D(
                    point,
                    1,
                    3,
                    time * 0.7 -
                    mouseY * 1.2
                );


            point =
                rotate4D(
                    point,
                    2,
                    3,
                    time * 0.5
                );


            point =
                rotate4D(
                    point,
                    0,
                    2,
                    time * 0.35
                );


            return project4D(point);

        });


    // ========================================================
    // SCALE
    // ========================================================

    const scale =
        Math.min(
            width,
            height
        ) * 0.28;


    const points =
        projected.map(function(point) {

            return {

                x:
                    width / 2 +
                    point[0] * scale,

                y:
                    height / 2 +
                    point[1] * scale,

                depth:
                    point[2]

            };

        });


    // ========================================================
    // EDGES
    // ========================================================

    ctx.lineWidth =
        Math.max(
            2,
            Math.min(width, height) * 0.006
        );

    ctx.lineCap =
        "round";

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "#8d72ff";

    ctx.strokeStyle =
        "#9d8aff";


    for (
        const edge of edges
    ) {

        const a =
            points[edge[0]];

        const b =
            points[edge[1]];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

    }


    // ========================================================
    // VERTICES
    // ========================================================

    ctx.shadowBlur =
        12;

    ctx.shadowColor =
        "#ffffff";

    ctx.fillStyle =
        "#ffffff";


    const radius =
        Math.max(
            3,
            Math.min(width, height) * 0.009
        );


    for (
        const point of points
    ) {

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    requestAnimationFrame(
        draw
    );

}


draw();

</script>

</body>
</html>
